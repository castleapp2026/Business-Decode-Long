name: Auto Render Business Decode Video

on:
  repository_dispatch:
    types: [render_and_upload]

# 👇 YEH BLOCK ADD KIYA GAYA HAI (Releases create karne ki permission) 👇
permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest

    steps:
      # 👇 Upgraded to v4 to fix Node.js deprecation warnings
      - name: Checkout Code
        uses: actions/checkout@v4

      # 👇 Upgraded to v5 to fix Node.js deprecation warnings
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==1.0.3 requests edge-tts urllib3 Pillow==9.5.0

      - name: Run Video Rendering Script
        env:
          FULL_TEXT: ${{ github.event.client_payload.full_text }}
          SCENES_DATA: ${{ github.event.client_payload.scenes_data }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          THUMBNAIL_PROMPT: ${{ github.event.client_payload.thumbnail_prompt }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }} 
          # 👇 YEH LINE ADD KI GAYI HAI 👇
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🚨 TELEGRAM BOT TOKEN BHI ADD KIYA HAI 🚨
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u render_video.py  

      # 👇 NAYA AUTO-DELETE BLOCK YAHAN HAI (Native GitHub CLI use karke) 👇
      - name: Auto-delete older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all releases, keep the first 3, and delete the rest
          releases=$(gh release list --repo ${{ github.repository }} | awk '{print $1}' | tail -n +4)
          if [ -n "$releases" ]; then
            for release in $releases; do
              echo "Deleting old release: $release"
              gh release delete "$release" --cleanup-tag -y --repo ${{ github.repository }}
            done
          else
            echo "No older releases found to delete."
          fi
